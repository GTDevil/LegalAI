name: Build Windows EXE

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Create virtual enviroment
        run: python -m venv .venv

      - name: Build executable
        shell: bash
        run: ./scripts/build_exe.sh

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: LegalAI-windows-exe
          path: dist/LegalAI.exe
          if-no-files-found: error

      - name: Stage browser calling desk
        shell: bash
        run: |
          mkdir -p dist-browser
          cp web/index.html START-HERE.txt dist-browser/
          cp DOUBLE-CLICK-TO-TEST.bat dist-browser/

      - name: Upload browser calling desk (no install)
        uses: actions/upload-artifact@v4
        with:
          name: LegalAI-open-in-browser
          path: dist-browser/
          if-no-files-found: error
